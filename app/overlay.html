<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Dungeon Director audience</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        color: white;
        font:
          22px "Segoe UI",
          sans-serif;
      }
      body.screen {
        background: #080c14;
      }
      #map {
        position: absolute;
        inset: 0;
      }
      #map img {
        width: 100%;
        height: 100%;
        object-fit: fill;
      }
      .map-surface {position:absolute;inset:auto;}
      .fog {
        position: absolute;
        background: #080c14;
      }
      .token {
        position: absolute;
        transform: translate(-50%, -50%);
        padding: 6px 10px;
        border: 2px solid white;
        border-radius: 30px;
      }
      #portrait {
        position: absolute;
        inset: 8% 25% 20%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #portrait img {
        max-width: 100%;
        max-height: 100%;
        filter: drop-shadow(0 8px 20px #000);
      }
      #title {
        position: absolute;
        bottom: 21%;
        width: 100%;
        text-align: center;
        text-shadow: 0 3px 8px black;
      }
      h1 {
        margin: 0;
        color: var(--accent, #e9bd73);
        font-size: 48px;
      }
      p {
        margin: 7px;
      }
      #party {
        position: absolute;
        bottom: 25px;
        left: 25px;
        right: 25px;
        display: flex;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      .avatar {
        width: 40px;
        height: 40px;
        object-fit: cover;
        border-radius: 50%;
        vertical-align: middle;
        margin-right: 10px;
      }
      .card {
        background: var(--panel, #101b2e);
        border: 1px solid #62728b;
        border-radius: 9px;
        padding: 13px 22px;
        min-width: 100px;
      }
      .card small {
        display: block;
        color: #a5dac8;
      }
      #initiative {
        position: absolute;
        right: 20px;
        top: 20px;
        display: grid;
        gap: 8px;
      }
      .active {
        border: 2px solid var(--accent, #e9bd73);
      }
      #dice {position:fixed;inset:0;background:transparent;pointer-events:none;z-index:10;}
      .dice-table {position:absolute;inset:0;width:100%;height:100%;}
      .dice-result {position:absolute;bottom:5%;left:15%;right:15%;text-align:center;color:#fff3d7;text-shadow:0 2px 4px #000,0 0 14px #000;font-size:22px;}
      #dice b {display:block;font-size:48px;color:#f8d99a;}
      .dice-result:not(.settled) b {font-size:24px;}
      .dice-accessible {position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);}
      #pause {
        display: none;
        z-index:20;
        position: absolute;
        inset: 0;
        background: #0c1323f5;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      #countdown {
        font-size: 70px;
        color: var(--accent, #e9bd73);
      }
      #map .token-image {width:64px;height:64px;object-fit:contain;display:block}
      [hidden] { display: none !important; }
      body.dice-only > :not(#dice), body.map-only > :not(#map) {display:none !important}
      body.dice-only,body.dice-only.screen {background:transparent !important;}
      #dice small {display:block}
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div id="portrait"></div>
    <div id="title"></div>
    <div id="party"></div>
    <div id="initiative"></div>
    <div id="dice"></div>
    <div id="pause">
      <div>
        <h1 id="pauseTitle"></h1>
        <p id="countdown"></p>
      </div>
    </div>
    <script src="/layout.js"></script>
    <script src="/dice-geometry.js"></script>
    <script src="/dice-view.js"></script>
    <script src="/overlay.js"></script>
  </body>
</html>
