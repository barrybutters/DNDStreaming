<!doctype html><html><head><meta charset="utf-8"><title>Dungeon Director audience</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:white;font:22px 'Segoe UI',sans-serif}body.screen{background:#080c14}#map{position:absolute;inset:0}#map img{width:100%;height:100%;object-fit:fill}.fog{position:absolute;background:#080c14}.token{position:absolute;transform:translate(-50%,-50%);padding:6px 10px;border:2px solid white;border-radius:30px}#portrait{position:absolute;inset:8% 25% 20%;display:flex;align-items:center;justify-content:center}#portrait img{max-width:100%;max-height:100%;filter:drop-shadow(0 8px 20px #000)}#title{position:absolute;bottom:21%;width:100%;text-align:center;text-shadow:0 3px 8px black}h1{margin:0;color:#e9bd73;font-size:48px}p{margin:7px}#party{position:absolute;bottom:25px;left:25px;right:25px;display:flex;justify-content:center;gap:12px}.card{background:#101b2eeb;border:1px solid #62728b;border-radius:9px;padding:13px 22px;min-width:100px}.card small{display:block;color:#a5dac8}#initiative{position:absolute;right:20px;top:20px;display:grid;gap:8px}.active{border:2px solid #e9bd73}#dice{position:absolute;left:30px;top:30px;background:#101b2eeb;padding:18px;border:1px solid #e9bd73;border-radius:12px}#dice b{display:block;font-size:46px;color:#e9bd73}#pause{display:none;position:absolute;inset:0;background:#0c1323f5;align-items:center;justify-content:center;text-align:center}#countdown{font-size:70px;color:#e9bd73}</style></head><body><div id="map"></div><div id="portrait"></div><div id="title"></div><div id="party"></div><div id="initiative"></div><div id="dice"></div><div id="pause"><div><h1 id="pauseTitle"></h1><p id="countdown"></p></div></div><script src="/overlay.js"></script></body></html>
