<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Dungeon Director audience</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        color: white;
        font:
          22px "Segoe UI",
          sans-serif;
      }
      body.screen {
        background: #080c14;
      }
      #map {
        position: absolute;
        inset: 0;
      }
      #map img {
        width: 100%;
        height: 100%;
        object-fit: fill;
      }
      .fog {
        position: absolute;
        background: #080c14;
      }
      .token {
        position: absolute;
        transform: translate(-50%, -50%);
        padding: 6px 10px;
        border: 2px solid white;
        border-radius: 30px;
      }
      #portrait {
        position: absolute;
        inset: 8% 25% 20%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #portrait img {
        max-width: 100%;
        max-height: 100%;
        filter: drop-shadow(0 8px 20px #000);
      }
      #title {
        position: absolute;
        bottom: 21%;
        width: 100%;
        text-align: center;
        text-shadow: 0 3px 8px black;
      }
      h1 {
        margin: 0;
        color: var(--accent, #e9bd73);
        font-size: 48px;
      }
      p {
        margin: 7px;
      }
      #party {
        position: absolute;
        bottom: 25px;
        left: 25px;
        right: 25px;
        display: flex;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      .avatar {
        width: 40px;
        height: 40px;
        object-fit: cover;
        border-radius: 50%;
        vertical-align: middle;
        margin-right: 10px;
      }
      .card {
        background: var(--panel, #101b2e);
        border: 1px solid #62728b;
        border-radius: 9px;
        padding: 13px 22px;
        min-width: 100px;
      }
      .card small {
        display: block;
        color: #a5dac8;
      }
      #initiative {
        position: absolute;
        right: 20px;
        top: 20px;
        display: grid;
        gap: 8px;
      }
      .active {
        border: 2px solid var(--accent, #e9bd73);
      }
      #dice {
        position: absolute;
        left: 30px;
        top: 30px;
        background: var(--panel, #101b2e);
        padding: 18px;
        border: 1px solid var(--accent, #e9bd73);
        border-radius: 12px;
      }
      #dice b {
        display: block;
        font-size: 46px;
        color: var(--accent, #e9bd73);
      }
      #pause {
        display: none;
        position: absolute;
        inset: 0;
        background: #0c1323f5;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      #countdown {
        font-size: 70px;
        color: var(--accent, #e9bd73);
      }
      [hidden] { display: none !important; }
      .dice-tray { display:flex; flex-wrap:wrap; gap:12px; margin:18px 0; max-width:540px; }
      .visual-die { display:grid; place-items:center; width:64px; height:64px; background:linear-gradient(135deg,#f4d798,#9b6228); color:#20150d; font-size:30px; font-weight:bold; clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%); }
      .rolling { animation:tumble .45s infinite ease-in-out; }
      @keyframes tumble { 0% {transform:rotate(0) translateY(0)} 50% {transform:rotate(170deg) translateY(-14px)} 100% {transform:rotate(360deg) translateY(0)} }
      @media(prefers-reduced-motion:reduce) { .rolling {animation:none} }
      body.dice-only > :not(#dice), body.map-only > :not(#map) {display:none !important}
      body.dice-only #dice {left:50%;top:50%;transform:translate(-50%,-50%);min-width:260px;text-align:center}
      #dice small {display:block}
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div id="portrait"></div>
    <div id="title"></div>
    <div id="party"></div>
    <div id="initiative"></div>
    <div id="dice"></div>
    <div id="pause">
      <div>
        <h1 id="pauseTitle"></h1>
        <p id="countdown"></p>
      </div>
    </div>
    <script src="/dice-view.js"></script>
    <script src="/overlay.js"></script>
  </body>
</html>
