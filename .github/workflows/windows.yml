name: Windows installer
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx install-electron
      - run: npm test
      - run: npm run test:ui
      - run: npm run test:desktop
      - run: npm run dist:win
      - name: Check packaged desktop
        run: |
          $process = Start-Process -FilePath "dist/win-unpacked/Dungeon Director.exe" -ArgumentList "--smoke-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Packaged application smoke test failed: $($process.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: Dungeon-Director-Windows
          path: dist/*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Dungeon-Director-Portable-Windows
          path: dist/*-Windows-*.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Dungeon-Director-Visual-Checks
          path: test-output/*.png
          if-no-files-found: ignore
